name: Bootstrap SIA v0.1 Files

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-release.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct official Blogger theme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p theme
          cat bootstrap/theme.part*.b64 | tr -d '\n\r ' | base64 --decode > theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml'
          ET.parse(path)
          print('XML validation OK')
          PY

      - name: Commit reconstructed file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add official SIA-Infinity Blogger Template v0.1"
            git push
          fi
