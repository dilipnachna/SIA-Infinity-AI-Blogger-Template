name: Bootstrap SIA v0.1 Files

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-release.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct official v0.1 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p theme generator
          cat bootstrap/theme.part*.b64 | tr -d '\n\r ' | base64 --decode > theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml
          cat bootstrap/generator.part*.b64 | tr -d '\n\r ' | base64 --decode > generator/generate_graph.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml')
          print('XML validation OK')
          PY
          python -m py_compile generator/generate_graph.py
          echo 'Python validation OK'

      - name: Commit reconstructed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml generator/generate_graph.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add official SIA-Infinity v0.1 theme and graph generator"
            git push
          fi
