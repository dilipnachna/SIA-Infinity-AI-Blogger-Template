name: Build SIA Intelligence Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["main"]
    paths:
      - "generator/**"
      - "assets/**"
      - "scripts/**"
      - "sia.config.json"
      - "sia.blogs.json"
      - "wrangler.jsonc"
      - ".github/workflows/sia-cron.yml"

permissions:
  contents: write

concurrency:
  group: "sia-intelligence-${{ github.repository }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize v0.1 theme and intelligence runtime
        run: |
          python scripts/activate_hybrid_graph.py
          python scripts/activate_fibonacci_knn.py
          python scripts/activate_hybrid_graph.py
          python scripts/activate_social_community.py

      - name: Test Fibonacci-KNN ranking
        run: |
          python scripts/test_fibonacci_knn.py

      - name: Generate registered Blogger graphs
        run: |
          python scripts/generate_all_graphs.py --registry sia.blogs.json --base-config sia.config.json

      - name: Publish adapter mirror
        run: |
          mkdir -p public
          cp assets/sia-graph-adapter-v0.1.js public/sia-graph-adapter-v0.1.js

      - name: Validate v0.1 outputs
        run: |
          python -m py_compile generator/generate_graph.py scripts/generate_all_graphs.py scripts/update_edge_manifest.py scripts/activate_fibonacci_knn.py scripts/test_fibonacci_knn.py scripts/activate_social_community.py
          python - <<'PY'
          import html
          import json
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          graphs = sorted(Path('public/graphs').glob('*/sia-graph.json'))
          if not graphs:
              raise SystemExit('No SIA graphs were generated')

          for path in graphs:
              graph = json.loads(path.read_text(encoding='utf-8'))
              assert graph['sia']['format'] == 'sia-symbolic-graph'
              assert graph['sia']['related_engine'] == 'fibonacci-knn-v0.1'
              assert graph['sia']['fibonacci_weights'] == {
                  'entity': 34.0,
                  'silo': 21.0,
                  'title': 13.0,
                  'label': 8.0,
                  'content_type': 5.0,
                  'facet': 3.0,
              }
              assert isinstance(graph.get('posts'), dict)
              for post in graph['posts'].values():
                  for item in post.get('related', []):
                      assert 0 <= item['score'] <= 100
                      assert 0 <= item['distance'] <= 1
                      assert 'fibonacci_knn' in item['reasons']
              print('Validated Fibonacci-KNN graph', path)

          theme_path = Path('theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml')
          theme = theme_path.read_text(encoding='utf-8')
          ET.parse(theme_path)
          if re.search(r'[\u0900-\u097F]', html.unescape(theme)):
              raise SystemExit('Universal Blogger XML contains Devanagari source text')
          if 'fibonacci_knn_fallback' not in theme:
              raise SystemExit('Blogger XML is missing Fibonacci-KNN fallback')

          required_theme_markers = [
              "name='sia-template'",
              "class='share-btn linkedin'",
              "class='share-btn reddit'",
              "class='share-btn pinterest'",
              "class='native-share native-share-btn'",
              'Explore the SIA Blogger Community',
              '// Share: Native Web Share',
          ]
          missing = [marker for marker in required_theme_markers if marker not in theme]
          if missing:
              raise SystemExit('Blogger XML is missing social/community markers: ' + ', '.join(missing))
          print('Blogger XML validation OK')
          PY

      - name: Commit graph and normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml \
            generator/generate_graph.py \
            assets/sia-graph-adapter-v0.1.js \
            public/sia-graph-adapter-v0.1.js \
            public/graphs
          if git diff --cached --quiet; then
            echo "Graph and source are already current"
          else
            git commit -m "Refresh SIA v0.1 theme and intelligence graphs"
            git push
          fi

      - name: Detect Cloudflare credentials
        id: cloudflare_check
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; Raw GitHub remains the precomputed source."
          fi

      - name: Deploy static intelligence to Cloudflare
        if: steps.cloudflare_check.outputs.enabled == 'true'
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc

      - name: Record Cloudflare edge endpoint
        if: steps.cloudflare_check.outputs.enabled == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
        run: |
          python scripts/update_edge_manifest.py "$DEPLOYMENT_URL"

      - name: Commit Cloudflare edge manifest
        if: steps.cloudflare_check.outputs.enabled == 'true'
        run: |
          git add public/sia-edge.json
          if git diff --cached --quiet; then
            echo "Cloudflare edge manifest is already current"
          else
            git commit -m "Update SIA v0.1 Cloudflare edge endpoint"
            git push
          fi
