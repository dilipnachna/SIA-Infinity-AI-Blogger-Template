name: Build SIA Intelligence Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches: ["main"]
    paths:
      - "generator/**"
      - "sia.config.json"
      - ".github/workflows/sia-cron.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sia-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SIA graph
        run: |
          python generator/generate_graph.py --config sia.config.json

      - name: Validate generated JSON
        run: |
          python -m json.tool public/sia-graph.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
