name: Build SIA Intelligence Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["main"]
    paths:
      - "generator/**"
      - "assets/**"
      - "scripts/**"
      - "schemas/**"
      - "sia.config.json"
      - "sia.blogs.json"
      - "wrangler.jsonc"
      - ".github/workflows/sia-cron.yml"

permissions:
  contents: write

concurrency:
  group: "sia-intelligence-${{ github.repository }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BLOGGER_API_MODE: auto
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Blogger API v3 source mode
        run: |
          python scripts/blogger_api.py --check-env

      - name: Test Blogger API v3 integration
        run: |
          python scripts/test_blogger_api.py

      - name: Normalize v0.1 adaptive theme and intelligence runtime
        run: |
          python scripts/activate_hybrid_graph.py
          python scripts/activate_fibonacci_knn.py
          python scripts/activate_hybrid_graph.py
          python scripts/activate_social_community.py
          python scripts/activate_adaptive_system_v2.py
          python scripts/activate_cwv_budget.py

      - name: Validate adaptive configuration
        run: |
          python scripts/validate_configs.py

      - name: Test adaptive Fibonacci-KNN ranking
        run: |
          python scripts/test_fibonacci_knn.py

      - name: Build verified SIA Blogger community registry
        if: github.repository == 'dilipnachna/SIA-Infinity-AI-Blogger-Template'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_community_registry.py \
            --root-repo dilipnachna/SIA-Infinity-AI-Blogger-Template \
            --output public/community/sia-community.json \
            --html-output public/community/index.html

      - name: Generate registered Blogger graphs
        run: |
          python scripts/generate_all_graphs.py --registry sia.blogs.json --base-config sia.config.json

      - name: Validate primary Blogger QA target
        run: |
          python scripts/test_primary_qa_blog.py

      - name: Publish adapter mirror
        run: |
          mkdir -p public
          cp assets/sia-graph-adapter-v0.1.js public/sia-graph-adapter-v0.1.js

      - name: Forensic validate v0.1 outputs
        run: |
          python -m py_compile \
            generator/generate_graph.py \
            scripts/blogger_api.py \
            scripts/blogger_oauth_setup.py \
            scripts/generate_graph_with_blogger_api.py \
            scripts/generate_all_graphs.py \
            scripts/test_blogger_api.py \
            scripts/update_edge_manifest.py \
            scripts/activate_fibonacci_knn.py \
            scripts/test_fibonacci_knn.py \
            scripts/test_primary_qa_blog.py \
            scripts/activate_social_community.py \
            scripts/activate_adaptive_system.py \
            scripts/activate_adaptive_system_v2.py \
            scripts/activate_attention_map.py \
            scripts/test_attention_map.py \
            scripts/activate_related_silo_grid.py \
            scripts/test_related_silo_grid.py \
            scripts/activate_media_author_reliability.py \
            scripts/test_media_author_reliability.py \
            scripts/activate_cwv_budget.py \
            scripts/test_cwv_budget.py \
            scripts/build_community_registry.py \
            scripts/validate_configs.py
          python - <<'PY'
          import html
          import json
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          graphs = sorted(Path('public/graphs').glob('*/sia-graph.json'))
          if not graphs:
              raise SystemExit('No SIA graphs were generated')

          expected_weights = {
              'entity': 34.0,
              'silo': 21.0,
              'title': 13.0,
              'label': 8.0,
              'content_type': 5.0,
              'facet': 3.0,
          }

          for path in graphs:
              graph = json.loads(path.read_text(encoding='utf-8'))
              sia = graph['sia']
              assert sia['format'] == 'sia-symbolic-graph'
              assert sia['related_engine'] == 'sia-fibonacci-knn-v0.1'
              assert sia['semantic_similarity_weights'] == expected_weights
              assert sia['fibonacci_weights'] == expected_weights
              assert sia['related_max_k'] == 55
              assert sia['related_display_limit'] == 6
              assert sia['fibonacci_knn']['k_rule'] == 'min(N,55,max(3,FibFloor(sqrt(N))))'
              assert sia['fibonacci_knn']['rank_weighting'] == 'normalized_phi_decay'
              assert 1.618 < sia['fibonacci_knn']['phi'] < 1.619
              assert isinstance(graph.get('posts'), dict)
              for post in graph['posts'].values():
                  previous_weight = None
                  for item in post.get('related', []):
                      assert 0 <= item['score'] <= 100
                      assert item['score'] == item['similarity']
                      assert 0 <= item['distance'] <= 1
                      assert 0 < item['rank_weight'] <= 1
                      assert item['recall_score'] >= 0
                      assert 'fibonacci_knn' in item['reasons']
                      assert 'adaptive_fibonacci_k' in item['reasons']
                      assert 'golden_ratio_rank' in item['reasons']
                      if previous_weight is not None:
                          assert item['rank_weight'] < previous_weight
                      previous_weight = item['rank_weight']
              print('Validated adaptive Fibonacci-KNN graph', path)

          community_path = Path('public/community/sia-community.json')
          if community_path.exists():
              community = json.loads(community_path.read_text(encoding='utf-8'))
              assert community['sia']['format'] == 'sia-blogger-community-registry'
              assert community['sia']['version'] == '0.1'
              assert community['sia']['mode'] == 'opt-in-repository-bound-blogspot-verification'
              assert isinstance(community.get('blogs'), list)
              assert community.get('verified_count') == len(community['blogs'])
              assert community.get('current_verified_count', 0) + community.get('grace_verified_count', 0) == community['verified_count']
              for blog in community['blogs']:
                  assert blog['url'].startswith('https://')
                  assert blog['hostname'].endswith('.blogspot.com')
                  assert blog['template'].startswith('SIA-Infinity-AI-Blogger-Template-v')
                  assert blog['source_repository']
                  assert blog['verification_state'] in {'current', 'grace'}
              print('SIA Blogger community registry validation OK')

          theme_path = Path('theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml')
          theme = theme_path.read_text(encoding='utf-8')
          ET.parse(theme_path)
          decoded = html.unescape(theme)
          if re.search(r'[\u0900-\u097F]', decoded):
              raise SystemExit('Universal Blogger XML contains Devanagari source text')

          required_theme_markers = [
              "name='sia-template'",
              "name='sia-community-repository'",
              'SIA Adaptive Heading Architecture v0.1',
              "<h1 class='post-title'><data:post.title/></h1>",
              "id='sia-featured-image'",
              "fetchpriority='high'",
              "width='1200'",
              "height='675'",
              'expr:srcset=',
              'SIA Featured Image URL Dedupe',
              'Share: Encoded social actions',
              'encodeURIComponent',
              'SIA WebSite JSON-LD v0.1',
              'SIA BreadcrumbList JSON-LD v0.1',
              'max-snippet:-1',
              "id='footer-links'",
              'Explore the SIA Blogger Community',
              'fibonacci_knn_fallback',
              'adaptiveFibonacciK',
              'goldenRankWeights',
              'SIA CWV Performance Budget v0.1',
              "name='sia-cwv-budget'",
              'p75-lcp-2.5s-inp-200ms-cls-0.1',
              "class='single-post-author-avatar-slot'",
              "class='single-post-author-card-avatar-slot'",
              'requestIdleCallback',
              '@supports selector(.sia-ad-zone:has(.widget))',
              'contain-intrinsic-size: auto 420px',
          ]
          missing = [marker for marker in required_theme_markers if marker not in theme]
          if missing:
              raise SystemExit('Blogger XML is missing adaptive markers: ' + ', '.join(missing))

          forbidden = [
              "href='/p/about.html'",
              "href='/p/contact.html'",
              "href='/p/privacy-policy.html'",
              "href='/p/disclaimer.html'",
              'let parentLink = bodyImg.parentNode;',
              '                  Advertisement\n',
              'byline.insertBefore(img, copy);',
              'card.insertBefore(img, copy);',
          ]
          present = [marker for marker in forbidden if marker in theme]
          if present:
              raise SystemExit('Blogger XML contains retired v0.1 patterns: ' + ', '.join(present))

          print('Blogger XML forensic validation OK')
          PY

      - name: Commit graph, community and normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            theme/SIA-Infinity-AI-Blogger-Template-v0.1.xml \
            generator/generate_graph.py \
            assets/sia-graph-adapter-v0.1.js \
            public/sia-graph-adapter-v0.1.js \
            public/graphs \
            public/community
          if git diff --cached --quiet; then
            echo "Adaptive graph, community and source are already current"
          else
            git commit -m "Refresh SIA v0.1 adaptive intelligence and community"
            git push
          fi

      - name: Detect Cloudflare credentials
        id: cloudflare_check
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; Raw GitHub remains the precomputed source."
          fi

      - name: Deploy static intelligence to Cloudflare
        if: steps.cloudflare_check.outputs.enabled == 'true'
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc

      - name: Record Cloudflare edge endpoint
        if: steps.cloudflare_check.outputs.enabled == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
        run: |
          python scripts/update_edge_manifest.py "$DEPLOYMENT_URL"

      - name: Commit Cloudflare edge manifest
        if: steps.cloudflare_check.outputs.enabled == 'true'
        run: |
          git add public/sia-edge.json
          if git diff --cached --quiet; then
            echo "Cloudflare edge manifest is already current"
          else
            git commit -m "Update SIA v0.1 Cloudflare edge endpoint"
            git push
          fi
